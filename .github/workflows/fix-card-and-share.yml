name: Fix card and share

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-card-and-share.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('app-v2.js')
          text = app.read_text(encoding='utf-8')
          old = "$('role').textContent=identity.eyebrow;$('who').textContent=identity.main;$('quote').textContent=item.quote;"
          new = "$('role').textContent=identity.eyebrow;$('who').textContent=identity.main;$('quote').textContent=item.quote;$('quote').dataset.scenarioId=item.id;$('quote').dataset.originalQuote=item.quote;$('quote').dataset.continuityApplied='0';"
          if old not in text:
              raise SystemExit('app render marker not found')
          app.write_text(text.replace(old,new,1),encoding='utf-8')

          q = Path('quality-guard.js')
          text = q.read_text(encoding='utf-8')
          pattern = re.compile(r"  function drawCard\(\) \{.*?    return canvas\.toDataURL\('image/png'\);\n  \}", re.S)
          replacement = r'''  function drawCard() {
    const ctx=canvas.getContext('2d');
    const stats=['r0','r1','r2','r3'].map(id=>Math.max(0,Math.min(100,Number($(id)?.textContent||0))));
    const title=$('className')?.textContent||'RED FLAG DETECTOR';
    const desc=$('classDesc')?.textContent||'';
    const summary=$('summaryLine')?.textContent||'';
    const traits=$('traitResult')?.textContent||'';
    const psychRows=[...document.querySelectorAll('#psychResult .psych-row')].map(row=>({
      label:String(row.querySelector('span')?.textContent||'').trim(),
      value:Math.max(0,Math.min(100,Number(row.querySelector('b')?.textContent||0)))
    })).filter(row=>row.label);
    const psychMeta=String(document.querySelector('#psychResult .psych-meta')?.textContent||'').trim();

    canvas.width=1080;
    canvas.height=1920;
    ctx.clearRect(0,0,1080,1920);
    ctx.fillStyle='#07090b';ctx.fillRect(0,0,1080,1920);
    ctx.strokeStyle='#364049';ctx.lineWidth=4;ctx.strokeRect(70,70,940,1780);
    ctx.fillStyle='#d2b06d';ctx.font='700 54px Georgia';ctx.textAlign='center';ctx.fillText('RED FLAG DETECTOR',540,165);
    ctx.fillStyle='#62c7c9';ctx.font='24px monospace';ctx.fillText('RELATIONSHIP OS // PLAYER FILE',540,225);
    ctx.fillStyle='#efe4cc';ctx.font='700 68px serif';ctx.fillText(title,540,330);
    ctx.textAlign='left';ctx.fillStyle='#a9aaa1';ctx.font='28px sans-serif';wrap(ctx,desc,130,405,820,44,2);

    drawMiniRadar(ctx,stats,540,785,225);

    ctx.fillStyle='#d2b06d';ctx.font='27px monospace';ctx.textAlign='left';wrap(ctx,summary,130,1130,820,40,2);
    ctx.fillStyle='#81bc8e';ctx.font='22px monospace';wrap(ctx,traits,130,1245,820,34,2);

    ctx.strokeStyle='#303b42';ctx.lineWidth=2;ctx.strokeRect(110,1330,860,385);
    ctx.fillStyle='#62c7c9';ctx.font='22px monospace';ctx.fillText('RELATIONSHIP PATTERN // 關係傾向',140,1380);
    if(psychMeta){ctx.fillStyle='#8f9693';ctx.font='18px sans-serif';ctx.fillText(psychMeta,140,1418);}

    const rowStart=1465;
    const rowGap=58;
    psychRows.slice(0,4).forEach((row,i)=>{
      const y=rowStart+i*rowGap;
      ctx.fillStyle='#aab1ae';ctx.font='20px sans-serif';ctx.fillText(row.label,140,y);
      ctx.strokeStyle='#2f3a40';ctx.lineWidth=2;ctx.strokeRect(320,y-19,500,20);
      ctx.fillStyle='#62c7c9';ctx.fillRect(322,y-17,Math.max(0,496*row.value/100),16);
      ctx.fillStyle='#efe4cc';ctx.font='700 22px monospace';ctx.textAlign='right';ctx.fillText(String(row.value),915,y);
      ctx.textAlign='left';
    });

    ctx.fillStyle='#68716f';ctx.font='16px sans-serif';wrap(ctx,'依本局部分日常關係情境的選擇整理，用來幫助自我觀察。這不是心理診斷，也不是正式心理量表分數。',140,1700,780,26,2);
    ctx.fillStyle='#d2b06d';ctx.font='700 18px monospace';ctx.textAlign='center';ctx.fillText('MAKOTO LAB',540,1794);
    ctx.fillStyle='#68716f';ctx.font='17px monospace';ctx.fillText('lancer1234.github.io/RED-FLAG-DETECTOR/',540,1832);
    return canvas.toDataURL('image/png');
  }'''
          text2, n = pattern.subn(replacement,text,count=1)
          if n != 1:
              raise SystemExit(f'drawCard replacement count={n}')
          q.write_text(text2,encoding='utf-8')

          wf=Path('.github/workflows/fix-card-and-share.yml')
          if wf.exists(): wf.unlink()
      - name: Commit fixes
        run: |
          git config user.name "Makoto Lab"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix card identity and 9x16 share analysis"
          git push origin HEAD:main
