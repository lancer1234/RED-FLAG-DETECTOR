name: Strip source comments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strip-code-comments.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove source comments
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          targets = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.js', '.css', '.html'} and '.git' not in p.parts and '.github' not in p.parts]

          for path in targets:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              out = []
              in_block = False

              for line in lines:
                  stripped = line.lstrip()

                  if in_block:
                      if '*/' in stripped:
                          in_block = False
                      continue

                  if stripped.startswith('//'):
                      continue

                  if stripped.startswith('/*'):
                      if '*/' not in stripped:
                          in_block = True
                      continue

                  out.append(line)

              text = ''.join(out)
              text = re.sub(r'(?s)<!--.*?-->\s*', '', text)
              path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/strip-code-comments.yml')
          if workflow.exists():
              workflow.unlink()
      - name: Commit cleanup
        run: |
          git config user.name "Makoto Lab"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove remaining source annotations"
          git push origin HEAD:main
